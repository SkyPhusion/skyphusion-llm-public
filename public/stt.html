<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>conversational STT - skyphusion-llm</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0E1730">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/stt.css">
</head>
<body class="stt-body">
  <!-- Conversational STT is a skyphusion-llm playground feature; standalone
       page with its own minimal chrome. -->
  <main class="stt-layout">
    <header class="stt-page-header">
      <a href="/" class="stt-back">&larr; back to chat</a>
      <h1>conversational STT</h1>
    </header>
    <p class="stt-status">
      Real-time speech recognition with turn detection, powered by Deepgram Flux
      (<code>@cf/deepgram/flux</code>) over a WebSocket. Click start, allow the mic, and talk.
    </p>

    <div class="stt-controls">
      <button id="stt-start" type="button">Start listening</button>
      <span id="stt-status" class="stt-status">idle</span>
    </div>

    <div id="stt-live" class="stt-live"><span class="stt-status">(live transcript appears here)</span></div>

    <h2 class="stt-status">turns</h2>
    <div id="stt-turns" class="stt-turns"></div>

    <details>
      <summary>raw events (debug)</summary>
      <div id="stt-debug" class="stt-debug"></div>
    </details>
  </main>

  <script src="/voice-widget.js"></script>
  <script src="/stt.js"></script>
</body>
</html>
